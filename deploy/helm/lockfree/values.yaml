image:
  repository: ghcr.io/your-org/lockfree-visualizer
  tag: latest
  pullPolicy: IfNotPresent

app:
  host: 0.0.0.0
  port: "8081"
  trustProxyHeaders: "true"

service:
  type: ClusterIP
  port: 80

persistence:
  enabled: true
  size: 1Gi

secrets:
  sessionSecret: change-me
  adminApiToken: change-me
  usersJson: |
    {
      "version": 1,
      "users": [
        {
          "username": "admin",
          "password_hash": "REPLACE_WITH_BCRYPT_HASH",
          "tenant": "default",
          "role": "admin"
        }
      ]
    }

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
