apiVersion: v1
kind: Namespace
metadata:
  name: lockfree
---
apiVersion: v1
kind: Secret
metadata:
  name: lockfree-visualizer-secrets
  namespace: lockfree
type: Opaque
stringData:
  LOCKFREE_SESSION_SECRET: change-me
  LOCKFREE_ADMIN_API_TOKEN: change-me
  users.json: |
    {
      "version": 1,
      "users": [
        {
          "username": "admin",
          "password_hash": "REPLACE_WITH_BCRYPT_HASH",
          "tenant": "default",
          "role": "admin"
        }
      ]
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lockfree-visualizer
  namespace: lockfree
spec:
  serviceName: lockfree-visualizer
  replicas: 1
  selector:
    matchLabels:
      app: lockfree-visualizer
  template:
    metadata:
      labels:
        app: lockfree-visualizer
    spec:
      containers:
        - name: app
          image: ghcr.io/your-org/lockfree-visualizer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8081"
            - name: LOCKFREE_USERS_FILE
              value: /app/config/users.json
            - name: LOCKFREE_TRUST_PROXY_HEADERS
              value: "true"
            - name: LOCKFREE_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: lockfree-visualizer-secrets
                  key: LOCKFREE_SESSION_SECRET
            - name: LOCKFREE_ADMIN_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lockfree-visualizer-secrets
                  key: LOCKFREE_ADMIN_API_TOKEN
          volumeMounts:
            - name: users
              mountPath: /app/config/users.json
              subPath: users.json
              readOnly: true
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: users
          secret:
            secretName: lockfree-visualizer-secrets
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: lockfree-visualizer
  namespace: lockfree
spec:
  selector:
    app: lockfree-visualizer
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: lockfree-visualizer
  namespace: lockfree
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: lockfree-visualizer
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lockfree-visualizer
  namespace: lockfree
spec:
  podSelector:
    matchLabels:
      app: lockfree-visualizer
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8081
  egress:
    - {}
